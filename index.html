<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080c14;
            color: #00d2ff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #0f172a;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            border: 1px solid #1e293b;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #080c14;
            border: 1px solid #334155;
            color: #00d2ff;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
        button {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }
        button:hover {
            background: #0369a1;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            transform: scale(1.03);
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            height: 24px;
        }
        .chat-box {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log {
            padding: 14px;
            background: #080c14;
            border-radius: 8px;
            border-left: 4px solid #334155;
            text-align: left;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }
        .user-log {
            border-color: #38bdf8;
            color: #e2e8f0;
        }
        .jarvis-log {
            border-color: #00d2ff;
            color: #38bdf8;
            background: #0c192e;
        }
        .error-log {
            border-color: #ef4444;
            color: #f87171;
            background: #1f1315;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>J.A.R.V.I.S.</h1>
    
    <div class="input-group">
        <input type="password" id="apiKey" placeholder="Google Gemini API Keyを入力してください">
    </div>

    <button id="micBtn" onclick="startListening()">話しかける</button>

    <div class="status" id="status">システム待機中...</div>

    <div class="chat-box">
        <div class="log user-log" id="userLog"><strong>あなた:</strong> 準備完了</div>
        <div class="log jarvis-log" id="jarvisLog"><strong>JARVIS:</strong> お呼びでしょうか、サー。指示をお待ちしております。</div>
    </div>
</div>

<script>
    // ブラウザの音声認識機能のセットアップ
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = false;

        recognition.onstart = () => {
            updateStatus('音声を聞き取っています...');
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            document.getElementById('userLog').innerHTML = `<strong>あなた:</strong> ${userText}`;
            updateStatus('JARVIS思考中...');

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showError('API Keyを入力してください。');
                return;
            }

            // Gemini API呼び出し
            await callGeminiAPI(userText, apiKey);
        };

        recognition.onerror = (e) => {
            showError('音声認識エラー: ' + e.error);
        };
    } else {
        alert('お使いのブラウザは音声認識に対応していません。Google Chrome等でお試しください。');
    }

    function startListening() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert('Gemini API Keyを入力してください。');
            return;
        }
        try {
            recognition.start();
        } catch(e) {
            console.log('すでに認識中の可能性があります:', e);
        }
    }

    // 無料版Gemini API（REST API呼び出し）
    async function callGeminiAPI(promptText, apiKey) {
        // 無料プランで動作する「gemini-2.5-flash」モデルのURL
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        const systemInstruction = "あなたはトニー・スタークに仕える高度なAIアシスタント「JARVIS（ジャービス）」です。丁寧で知的、少しユーモアのある紳士的な執事の口調（「〜でございます、サー」「承知いたしました」など）で返答してください。音声合成で読み上げるため、特殊文字や記号、絵文字は一切使わず、短く1〜2文程度で簡潔に回答してください。";

        const requestBody = {
            system_instruction: {
                parts: [{ text: systemInstruction }]
            },
            contents: [
                {
                    parts: [{ text: promptText }]
                }
            ]
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (!response.ok) {
                // エラー応答時の処理
                const errorMsg = data.error ? data.error.message : 'APIリクエストに失敗しました';
                showError('APIエラー: ' + errorMsg);
                return;
            }

            // 正常応答の抽出
            const replyText = data.candidates[0].content.parts[0].text;
            document.getElementById('jarvisLog').className = 'log jarvis-log';
            document.getElementById('jarvisLog').innerHTML = `<strong>JARVIS:</strong> ${replyText}`;
            updateStatus('応答完了');

            // 音声で喋らせる
            speak(replyText);

        } catch (err) {
            showError('通信エラーが発生しました: ' + err.message);
        }
    }

    // 音声読み上げ機能
    function speak(text) {
        window.speechSynthesis.cancel(); // 前の発声をクリア
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.pitch = 0.9; // 低めの落ち着いた声
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
    }

    function updateStatus(text) {
        document.getElementById('status').innerText = text;
    }

    function showError(msg) {
        updateStatus('エラーが発生しました');
        const jarvisLog = document.getElementById('jarvisLog');
        jarvisLog.className = 'log error-log';
        jarvisLog.innerHTML = `<strong>エラー:</strong> ${msg}`;
    }
</script>

</body>
</html>
